name: Daily Buyback Check

on:
  schedule:
    # Every day at 10:00 UTC (17:00 WIB)
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-buybacks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync buybacks into idx_buybacks
        # Writes to the DB only when the repo variable BUYBACK_UPSERT is "true"; otherwise a dry run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python automation/buyback_sync.py --days 14 ${{ vars.BUYBACK_UPSERT != 'true' && '--dry-run' || '' }}

      - name: Commit extraction cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/buyback_extractions.json
          git diff --cached --quiet || git commit -m "chore: update buyback extractions [skip ci]"
          git push
