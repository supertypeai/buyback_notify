name: Daily Buyback Check

on:
  schedule:
    # Every day at 10:00 UTC (17:00 WIB)
    # Failure emails go to whoever last changed this line (GitHub rule), so edit it to take them over
    - cron: "0 10 * * 0-6"
  workflow_dispatch:
    inputs:
      since:
        description: "Backfill from this date (YYYY-MM-DD) instead of the last 14 days"
        required: false

permissions:
  contents: write

jobs:
  sync-buybacks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync buybacks into idx_buybacks
        # Writes to the DB only when the repo variable BUYBACK_UPSERT is "true"; otherwise a dry run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SINCE: ${{ inputs.since }}
          DRY_RUN: ${{ vars.BUYBACK_UPSERT != 'true' && '--dry-run' || '' }}
        run: |
          if [ -n "$SINCE" ]; then
            [[ "$SINCE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "since must be YYYY-MM-DD"; exit 1; }
            python automation/buyback_sync.py --since "$SINCE" $DRY_RUN
          else
            python automation/buyback_sync.py --days 14 $DRY_RUN
          fi

      - name: Sync treasury registry into idx_buybacks
        # Runs even if the buyback sync failed. Writes only when the repo variable TREASURY_UPSERT is "true"
        if: ${{ !cancelled() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python automation/treasury_sync.py ${{ vars.TREASURY_UPSERT != 'true' && '--dry-run' || '' }}

      - name: Commit extraction caches
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update buyback extractions [skip ci]"
          git push
